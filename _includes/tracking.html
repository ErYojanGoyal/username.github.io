{% if site.google_ads_id != blank %}<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_ads_id }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ site.google_ads_id }}');
document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href')||'',l='';
{% if site.call_label != blank %}if(h.indexOf('tel:')===0)l='{{ site.call_label }}';{% endif %}
{% if site.whatsapp_label != blank %}if(h.indexOf('wa.me')>-1)l='{{ site.whatsapp_label }}';{% endif %}
if(l)gtag('event','conversion',{send_to:'{{ site.google_ads_id }}/'+l});});</script>{% endif %}
