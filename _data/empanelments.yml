# To add a new empanelment: copy one block below (from "- name:" down
# to the last line of that block), paste it at the end, and change the
# details. Keep the two spaces at the start of each line inside a block.
# Newest first looks best, but any order works.
#
#   name:     Bank / institution name (required)
#   type:     Short label shown as a tag, e.g. Public Sector Bank,
#             Private Bank, Cooperative Bank, Small Finance Bank, NBFC,
