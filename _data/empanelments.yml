#   location: Office or region the empanelment is for
#   scope:    Asset class or scope of empanelment
#   since:    Month and year of empanelment, e.g. November 2026
#   ref:      (optional) Letter reference number - leave empty ("")
#             if you prefer not to publish it
#   logo:     (optional) Image file name in the website folder, e.g.
#             lccb-logo.png - leave empty ("") for no logo
# ------------------------------------------------------------------

