# ------------------------------------------------------------------
# BOOKS shown on the home page (section "Books by Er. Chandan Goyal").
#
# To add a book: copy one block (from "- title:" to "available:"), paste
# it below the others and change the details. To change a price, just
# edit the numbers. Keep the two spaces at the start of each line.
#
#   title:       Book title (required)
#   subtitle:    (optional) Edition / volume / asset class
#   description: Two or three sentences about the book
#   mrp:         MRP in rupees, numbers only, e.g. 650  (leave "" to show
#                "Price on request")
#   discount:    Discount in percent, numbers only, e.g. 20  (0 = no discount)
#   net_price:   (optional) Leave "" and the website calculates
#                MRP minus discount automatically. Fill it only if you want
#                to show a different, exact price.
#   cover:       (optional) Image file name in the website folder, e.g.
#                book1-cover.jpg - leave "" for a plain book icon
#   available:   yes = shows "Buy on WhatsApp" button; no = "Coming soon"
# ------------------------------------------------------------------

