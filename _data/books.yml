# ------------------------------------------------------------------
# BOOKS shown on the home page (section "Books").
#
# Books are grouped on the website by "series" (books with exactly the
# same series text appear together, in the order listed here).
#
# To add a book: copy one block (from "- title:" to "available:"), paste
# it in the right place and change the details. To change a price, just
# edit the numbers. Keep the spaces at the start of each line exactly.
#
#   series:      Group heading, e.g. "Land & Building and Plant & Machinery"
#   title:       Book title
#   subtitle:    Asset class / type of book
#   volume:      e.g. "Volume – 1" (leave "" if none)
#   authors:     Author line shown on the card
#   description: Two or three sentences about the book
#   chapters:    List of chapters/topics; each has "name" and, optionally,
#                "weightage" (e.g. "3 Marks"). Shown in a fold-out list.
#   mrp:         MRP in rupees, numbers only
#   discount:    Discount in percent, numbers only (0 = none)
#   net_price:   Leave "" and the website calculates MRP minus discount
#   cover:       (optional) cover image file name, e.g. book1-cover.jpg
#   available:   yes = "Buy on WhatsApp" button; no = "Coming soon"
# ------------------------------------------------------------------

